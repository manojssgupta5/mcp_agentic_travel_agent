airline_code: QF
airline_name: Qantas Airways
ndc_version: "21.3"

# Environment variables (set for live mode; absent = mock mode)
env_vars:
  base_url: QF_NDC_BASE_URL
  api_key:  QF_NDC_API_KEY
  client_id: QF_NDC_CLIENT_ID   # optional, for OAuth flows

# Endpoints (relative to base_url)
endpoints:
  AirShopping: /v1/airshopping
  OrderCreate: /v1/ordercreate

# Authentication
auth:
  type: api_key
  header: X-API-Key

# Supported verbs
supported_verbs:
  - AirShopping
  - OrderCreate

# Request quirks
request_quirks:
  - Point-of-sale country is required: use posCountry in all requests
  - Currency must be a valid ISO 4217 code; default is AUD for QF
  - Cabin codes: ECONOMY → Y, BUSINESS → C, FIRST → F
  - Passenger type: always use ADT for adult

# Response quirks
response_quirks:
  - OfferID attribute is on the <Offer> element, not a child element
  - TotalAmount is in <TotalAmount><SimpleCurrencyPrice Code="AUD">850.00</SimpleCurrencyPrice>
  - BookingReference PNR is a 6-character alphanumeric under <BookingReference><ID>
  - OrderStatus values: CONFIRMED, TICKETED, ON_HOLD, PENDING_TICKETING
  - TicketingDeadline is ISO-8601 datetime string

# Mock files (classpath)
mock_files:
  AirShopping: /ndc/mock/qf_airshopping_rs.xml
  OrderCreate: /ndc/mock/qf_ordercreate_rs.xml
