airline_code: UL
airline_name: SriLankan Airlines
ndc_version: "21.3"

# Environment variables (set for live mode; absent = mock mode)
env_vars:
  base_url: UL_NDC_BASE_URL
  api_key:  UL_NDC_API_KEY
  client_id: UL_NDC_CLIENT_ID   # optional

# Endpoints (relative to base_url)
endpoints:
  AirShopping: /ndc/airshopping
  OrderCreate: /ndc/ordercreate

# Authentication
auth:
  type: api_key
  header: X-API-Key

# Supported verbs
supported_verbs:
  - AirShopping
  - OrderCreate

# Request quirks
request_quirks:
  - Point-of-sale country default is AE (UAE) for UL Middle East gateway
  - Currency: default USD accepted; LKR also supported
  - Cabin codes: ECONOMY → Y, BUSINESS → C
  - UL does not operate First class on most routes
  - Nationality field is required for passenger in OrderCreate

# Response quirks
response_quirks:
  - OfferID attribute is on the <Offer> element
  - TotalAmount uses <SimpleCurrencyPrice Code="USD"> format
  - PNR is under <BookingReference><ID> — 6 alphanumeric chars
  - OrderStatus may be CONFIRMED or PENDING_TICKETING (no ON_HOLD)
  - TicketingDeadline present only for deferred ticketing arrangements
  - UL response includes <MarketingCarrier><AirlineID>UL</AirlineID>

# Mock files (classpath)
mock_files:
  AirShopping: /ndc/mock/ul_airshopping_rs.xml
  OrderCreate: /ndc/mock/ul_ordercreate_rs.xml
